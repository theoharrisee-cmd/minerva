services:
  - type: web
    name: minerva
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan; see DEPLOY.md for the free option
    healthCheckPath: /healthz
    envVars:
      - key: MINERVA_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: MINERVA_HOME
        value: /data
    disk:
      name: minerva-data
      mountPath: /data
      sizeGB: 1
