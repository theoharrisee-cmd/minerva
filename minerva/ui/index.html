<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerva</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="logo">M</div><span>Minerva</span></div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button class="ghost" id="themeBtn" title="Toggle theme"></button>
      <div class="ver">v0.3 MVP</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title">Overview</h1><div class="sub" id="subtitle"></div></div>
      <div class="top-r">
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search sites, agents, postcodes" autocomplete="off"></div>
        <button class="btn primary" id="refreshBtn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Refresh listings</span></button>
        <button class="btn" id="addBtn">Add deal</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toasts" id="toasts"></div>
<div class="modal-wrap" id="modal"></div>
<script src="app.js"></script>
<script src="features.js"></script>
</body>
</html>
